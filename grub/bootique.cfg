# bootique: point grub at the boot-menu theme, and run the menu at 1024x768.
# Sourced by grub-mkconfig after /etc/default/grub; 00_header then activates
# gfxmenu and renders the menu with the theme's photo background + hex colours
# (see theme.txt). With a theme set, GRUB_BACKGROUND/GRUB_FONT are ignored, so
# the theme is the single source for the boot-menu look. Generated; do not edit.
GRUB_THEME="/boot/grub/themes/bootique/theme.txt"
# THE MENU MODE IS HOW THE TEXT GETS BIGGER. The only font a Secure Boot box
# can use is the signed GRUB's built-in Unifont 16 (see setup.sh), a fixed 16
# pixels, so on a 2880-wide panel it is tiny at native. At 1024x768 the panel
# scales the whole menu up about 2.3x. 1024x768 because firmware usually offers
# only the classic modes plus native: measured on dragonfly, 1024x768 and
# 640x480 exist and 1440x900 does not. `auto` is the fallback for one without
# it, which is no worse than native.
# THE KERNEL INHERITS THIS MODE: under the signed EFI loader GRUB_GFXPAYLOAD and
# even a mode switch inside the boot entry are undone at the handoff (measured
# in a shim + signed GRUB + Secure Boot VM). Harmless where early KMS brings the
# GPU driver up before plymouth draws, which is what bootique's KMS drop-in is
# for: on dragonfly xe had its framebuffer at 3.27s, plymouth started at 3.49s.
GRUB_GFXMODE="1024x768,auto"
