# bootique -- point grub at the boot-menu theme. Sourced by grub-mkconfig after
# /etc/default/grub; 00_header then activates gfxmenu, loads the theme's fonts,
# and renders the menu with the theme's photo background + hex colours (see
# theme.txt). With a theme set, GRUB_BACKGROUND/GRUB_FONT are ignored, so the
# theme is the single source for the boot-menu look. Generated -- do not edit.
GRUB_THEME="/boot/grub/themes/bootique/theme.txt"
